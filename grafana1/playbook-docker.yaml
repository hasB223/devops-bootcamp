- name: Pasang Docker dan jalankan Prometheus
  hosts: node1
  become: true
  tasks:
    - name: Pasang Docker Engine dan Compose plugin
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: yes

    - name: Hidupkan servis docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Cipta direktori /opt/prometheus
      file:
        path: /opt/prometheus
        state: directory
        mode: "0755"

    - name: Salin compose.yaml
      copy:
        src: compose.yaml
        dest: /opt/prometheus/compose.yaml

    - name: Salin prometheus.yaml
      copy:
        src: prometheus.yaml
        dest: /opt/prometheus/prometheus.yaml

    - name: Jalankan docker compose
      community.docker.docker_compose_v2:
        project_src: /opt/prometheus
        state: present
