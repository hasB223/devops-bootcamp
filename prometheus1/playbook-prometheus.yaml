- name: Pasang Prometheus
  hosts: node1
  become: true
  roles:
    - prometheus.prometheus.prometheus
  vars:
    prometheus_scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: node_exporter
        static_configs:
          - targets:
              - '<node1_private_ip>:9100'
              - '<node2_private_ip>:9100'